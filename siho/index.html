<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시오의원 | 홈페이지 시안</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
      background: #f5f3f0;
      color: #333;
    }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #e8e4df;
      box-shadow: 0 1px 8px rgba(0,0,0,0.06);
    }

    .nav-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      height: 64px;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
      color: #5a4a3a;
      letter-spacing: 2px;
    }

    .logo span {
      font-weight: 400;
      font-size: 12px;
      color: #a09080;
      margin-left: 8px;
      letter-spacing: 1px;
    }

    .menu {
      display: flex;
      gap: 4px;
      list-style: none;
      align-items: center;
    }

    .menu-divider {
      width: 1px;
      height: 20px;
      background: #ddd;
      margin: 0 8px;
    }

    .menu li a {
      display: block;
      padding: 10px 16px;
      text-decoration: none;
      color: #888;
      font-size: 14px;
      font-weight: 500;
      border-radius: 8px;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .menu li a:hover {
      color: #5a4a3a;
      background: #f0ebe5;
    }

    .menu li a.active {
      color: #5a4a3a;
      background: #ece6de;
      font-weight: 600;
    }

    main {
      padding-top: 64px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .viewer {
      width: 100%;
      max-width: 1400px;
      padding: 32px 24px;
      text-align: center;
    }

    .viewer img {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      transition: opacity 0.3s ease;
    }

    .viewer img.fade {
      opacity: 0;
    }

    .page-indicator {
      text-align: center;
      padding: 20px;
      color: #a09080;
      font-size: 13px;
    }

    .gallery {
      width: 100%;
      max-width: 1400px;
      padding: 32px 24px 60px;
      display: none;
    }

    .gallery.show {
      display: block;
    }

    .gallery-grid {
      columns: 3;
      column-gap: 16px;
    }

    .gallery-item {
      break-inside: avoid;
      margin-bottom: 16px;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
    }

    .gallery-item img {
      width: 100%;
      display: block;
      transition: transform 0.4s ease, filter 0.4s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.03);
      filter: brightness(0.92);
    }

    .lightbox {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 200;
      background: rgba(0,0,0,0.9);
      justify-content: center;
      align-items: center;
      cursor: zoom-out;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.4);
    }

    .lightbox-close {
      position: absolute;
      top: 24px;
      right: 32px;
      color: #fff;
      font-size: 32px;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.2s;
      background: none;
      border: none;
      font-family: inherit;
    }

    .lightbox-close:hover {
      opacity: 1;
    }

    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: #fff;
      font-size: 40px;
      cursor: pointer;
      opacity: 0.5;
      transition: opacity 0.2s;
      background: none;
      border: none;
      padding: 20px;
      user-select: none;
    }

    .lightbox-nav:hover {
      opacity: 1;
    }

    .lightbox-prev { left: 16px; }
    .lightbox-next { right: 16px; }

    .lightbox-counter {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.6);
      font-size: 14px;
    }

    @media (max-width: 1024px) {
      .gallery-grid {
        columns: 2;
      }
    }

    @media (max-width: 768px) {
      .nav-inner {
        flex-direction: column;
        height: auto;
        padding: 12px 16px;
        gap: 8px;
      }

      .menu {
        gap: 2px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .menu li a {
        padding: 8px 12px;
        font-size: 13px;
      }

      .menu-divider {
        display: none;
      }

      main {
        padding-top: 110px;
      }

      .viewer {
        padding: 16px 12px;
      }

      .gallery {
        padding: 16px 12px 40px;
      }

      .gallery-grid {
        columns: 1;
        column-gap: 12px;
      }
    }
  </style>
</head>
<body>

  <nav>
    <div class="nav-inner">
      <div class="logo">SHIO CLINIC <span>홈페이지 시안</span></div>
      <ul class="menu">
        <li><a href="#" data-page="1" class="active">About</a></li>
        <li><a href="#" data-page="2">Signature</a></li>
        <li><a href="#" data-page="3">Treatments</a></li>
        <li><a href="#" data-page="4">Reserve</a></li>
        <li><a href="#" data-page="5">Event</a></li>
        <li><a href="#" data-page="6">Story</a></li>
        <li class="menu-divider"></li>
        <li><a href="#" data-page="gallery">Image</a></li>
        <li><a href="#" data-page="beforeafter">Before&After</a></li>
      </ul>
    </div>
  </nav>

  <main>
    <!-- 시안 뷰어 (About ~ Story + Before&After 공용) -->
    <div class="viewer" id="viewer-section">
      <img id="page-image" src="assets/01.about.png" alt="시오의원 시안">
    </div>

    <!-- 이미지 갤러리 -->
    <div class="gallery" id="gallery-section">
      <div class="gallery-grid" id="gallery-grid"></div>
    </div>
  </main>

  <div class="page-indicator" id="indicator">1 / 6</div>

  <!-- 라이트박스 -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lb-close">&times;</button>
    <button class="lightbox-nav lightbox-prev" id="lb-prev">&#8249;</button>
    <button class="lightbox-nav lightbox-next" id="lb-next">&#8250;</button>
    <img id="lb-image" src="" alt="">
    <div class="lightbox-counter" id="lb-counter"></div>
  </div>

  <script>
    // 시안 페이지 (Before&After 포함)
    const pages = [
      'assets/01.about.png',
      'assets/02.signature.png',
      'assets/03.treatments.png',
      'assets/04.reserve.png',
      'assets/05.event.png',
      'assets/06.story.png'
    ];

    const baImage = 'assets/07_bf.jpg';

    const img = document.getElementById('page-image');
    const indicator = document.getElementById('indicator');
    const links = document.querySelectorAll('.menu a');
    const viewerSection = document.getElementById('viewer-section');
    const gallerySection = document.getElementById('gallery-section');

    let currentMode = 'viewer'; // 'viewer' | 'gallery' | 'beforeafter'

    function setMode(mode) {
      currentMode = mode;
      if (mode === 'viewer' || mode === 'beforeafter') {
        viewerSection.style.display = '';
        gallerySection.classList.remove('show');
        indicator.style.display = mode === 'viewer' ? '' : 'none';
      } else if (mode === 'gallery') {
        viewerSection.style.display = 'none';
        gallerySection.classList.add('show');
        indicator.style.display = 'none';
      }
    }

    function showPage(index) {
      setMode('viewer');
      img.classList.add('fade');

      setTimeout(() => {
        img.src = pages[index];
        indicator.textContent = (index + 1) + ' / ' + pages.length;

        links.forEach(link => link.classList.remove('active'));
        document.querySelector(`[data-page="${index + 1}"]`).classList.add('active');

        img.onload = () => img.classList.remove('fade');
      }, 150);
    }

    function showBeforeAfter() {
      setMode('beforeafter');
      img.classList.add('fade');

      setTimeout(() => {
        img.src = baImage;
        img.onload = () => img.classList.remove('fade');
      }, 150);
    }

    links.forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const page = link.dataset.page;

        links.forEach(l => l.classList.remove('active'));
        link.classList.add('active');

        if (page === 'gallery') {
          setMode('gallery');
        } else if (page === 'beforeafter') {
          showBeforeAfter();
        } else {
          showPage(parseInt(page) - 1);
        }
      });
    });

    // 키보드 방향키 (viewer 모드에서만)
    document.addEventListener('keydown', (e) => {
      if (currentMode !== 'viewer') return;

      const current = document.querySelector('.menu a.active');
      if (!current || !current.dataset.page || isNaN(parseInt(current.dataset.page))) return;
      const currentIndex = parseInt(current.dataset.page) - 1;

      if (e.key === 'ArrowRight' && currentIndex < pages.length - 1) {
        showPage(currentIndex + 1);
      } else if (e.key === 'ArrowLeft' && currentIndex > 0) {
        showPage(currentIndex - 1);
      }
    });

    // ── 갤러리 ──
    const galleryImages = [
      'assets/01.about.png',
      'assets/02.signature.png',
      'assets/03.treatments.png',
      'assets/04.reserve.png',
      'assets/05.event.png',
      'assets/sub/01.png',
      'assets/sub/02.png',
      'assets/sub/03.png',
      'assets/sub/04.png',
      'assets/sub/05.png',
      'assets/sub/01_SHIO_h.jpg',
      'assets/sub/02_SHIO_h.jpg',
      'assets/sub/03_SHIO_h.jpg',
      'assets/sub/04_SHIO_h.jpg',
      'assets/sub/05_SHIO_h.jpg',
      'assets/sub/06_SHIO_h.jpg',
      'assets/sub/07_SHIO_h.jpg',
      'assets/sub/08_SHIO_h.jpg',
      'assets/sub/09_h.jpg',
      'assets/sub/10_h.jpg',
      'assets/sub/11_h.jpg',
      'assets/sub/12_h.jpg',
      'assets/sub/13_h.jpg',
      'assets/sub/14_h.jpg',
      'assets/sub/15_h.jpg',
      'assets/sub/16_h.jpg',
      'assets/sub/17_h.jpg',
      'assets/sub/18_h.jpg',
      'assets/sub/19_h.jpg',
      'assets/sub/20_h.jpg',
      'assets/sub/21_h.jpg',
      'assets/sub/22_h.jpg',
      'assets/sub/23_h.jpg',
      'assets/sub/24_h.jpg',
      'assets/sub/new01_ (1).jpg',
      'assets/sub/new01_ (2).jpg',
      'assets/sub/new01_ (3).jpg',
      'assets/sub/new01_ (4).jpg',
      'assets/sub/new01_ (5).jpg',
      'assets/sub/new01_ (6).jpg',
      'assets/sub/new01_ (7).jpg',
      'assets/sub/new01_ (8).jpg',
      'assets/sub/new01_ (9).jpg',
      'assets/sub/new01_ (10).jpg'
    ];

    const grid = document.getElementById('gallery-grid');
    galleryImages.forEach((src, i) => {
      const item = document.createElement('div');
      item.className = 'gallery-item';
      item.innerHTML = `<img src="${src}" alt="Image ${i + 1}" loading="lazy">`;
      item.addEventListener('click', () => {
        activeLightboxImages = galleryImages;
        openLightbox(i);
      });
      grid.appendChild(item);
    });

    // ── 라이트박스 ──
    const lightbox = document.getElementById('lightbox');
    const lbImage = document.getElementById('lb-image');
    const lbCounter = document.getElementById('lb-counter');
    let lbIndex = 0;
    let activeLightboxImages = galleryImages;

    function openLightbox(index) {
      lbIndex = index;
      lbImage.src = activeLightboxImages[index];
      lbCounter.textContent = (index + 1) + ' / ' + activeLightboxImages.length;
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      document.body.style.overflow = '';
    }

    document.getElementById('lb-close').addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });

    document.getElementById('lb-prev').addEventListener('click', (e) => {
      e.stopPropagation();
      if (lbIndex > 0) openLightbox(lbIndex - 1);
    });

    document.getElementById('lb-next').addEventListener('click', (e) => {
      e.stopPropagation();
      if (lbIndex < activeLightboxImages.length - 1) openLightbox(lbIndex + 1);
    });

    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft' && lbIndex > 0) openLightbox(lbIndex - 1);
      if (e.key === 'ArrowRight' && lbIndex < activeLightboxImages.length - 1) openLightbox(lbIndex + 1);
    });
  </script>

</body>
</html>
